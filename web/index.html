<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="Tu celular como Joy-Con, con movimiento, para jugar en la Xbox.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0E0E10">

  <!-- Al "Agregar a inicio" en iPhone se abre a pantalla completa, como una app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Joy-Con">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Joy-Con DSU</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0E0E10; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
    #cargando { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #fff; font: 700 18px -apple-system, system-ui, sans-serif; }
    #cargando .jc { display: flex; gap: 6px; }
    #cargando .jc i { width: 30px; height: 62px; display: block; animation: lat 1s ease-in-out infinite alternate; }
    #cargando .jc i:first-child { background: #0AB9E6; border-radius: 26px 6px 6px 26px; }
    #cargando .jc i:last-child { background: #FF3C28; border-radius: 6px 26px 26px 6px; animation-delay: .5s; }
    @keyframes lat { to { transform: translateY(-8px); } }
  </style>
</head>
<body>
  <div id="cargando"><div class="jc"><i></i><i></i></div>Cargando el control…</div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
